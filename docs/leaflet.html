<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>New Mexico County Population</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-ajax@2.1.0/dist/leaflet.ajax.min.js"></script>
  <style>
    body { margin: 0; }
    #map { height: 100vh; width: 100vw; }
    #title {
        position: fixed;
        top: 10px;
        left: 55px;
        z-index: 800;
        margin: 0;
        padding: 10px 15px;
        background: rgba(247, 139, 139, 0.5);
        border: 1px solid rgb(12, 11, 11);
        border-radius: 3px;
    }
  </style>
  
</head>
<body>
  <div id="map"></div>

  <!-- TODONE: update this title -->
  <div id="title">
     <h1>New Mexico County Population</h1>
     <p>Population data for New Mexico counties in 2018. Data source: U.S. Census Bureau. Created by Logan Reed
   </div>
  <script>
    
    //TODONE: Update these default zoom settings 
    const map = L.map('map').setView([34.45, -106.10], 6); 

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // TODONE: Update the Default Colors: Now Purple and Light Purple
    const countyLayer = new L.GeoJSON.AJAX('data/popul_byco2018.geojson', {
        style: {
          color: '#54278f',
          weight: 2,
          opacity: 1,
          fillColor: '#9e9ac8',
          fillOpacity: 0.55
        },
        }).addTo(map);

    // TODONE: Update the correct popup fields. The map shows the county borders and when selected shows names and population.
countyLayer.on('click', (e) => {
    const feature = e.layer.feature;

    const countyName = feature.properties.cowntee_NA;
    const population = feature.properties.popul_byco;

    const popupContent = `
        <h3>${countyName} County</h3>
        <p><strong>Population:</strong> ${Number(population).toLocaleString()}</p>
    `;

    e.layer.bindPopup(popupContent).openPopup();
});
  </script>
</body>
</html>
