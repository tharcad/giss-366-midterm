<!DOCTYPE html>
<html>
<head>
    <title>New Mexico County Population</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.10.0/dist/maplibre-gl.css" />
    <style>
        body { margin: 0; }
        #map { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script type="module">
    // Customizations:
    // 1. Centered, tilted, and rotated the map over New Mexico.
    // 2. Added a scale-bar control.
    // 3. Customized the county fill and outline colors.

        import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.10.0/dist/maplibre-gl.mjs';

       // TODONE: Update the default map settings
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/positron',
            center: [-106.10, 34.45],
            zoom: 5,
            pitch: 35,
            bearing: -12
        });
        window.map = map;   // exposes map to the browser console for debugging

       // TODOBRoke:
            map.addControl(new maplibregl.NavigationControl(), 'top-left');
            map.addControl(new maplibregl.ScaleControl({ maxWidth: 150, unit: 'imperial' }), 'bottom-left');
        map.on('load', () => {
            map.addSource('county_pop', {
                type: 'geojson',
                data: 'data/popul_byco2018.geojson'})
            });

            map.addLayer({
                id: 'county_pop', type: 'fill', source: 'county_pop',
                paint: {'fill-color': '#9e9ac8',
                        'fill-opacity': 0.60}
            });

            map.addLayer({
                id: 'county_lines', type: 'line', source: 'county_pop',
                paint: {'line-color': '#54278f',
                        'line-width': 2}
            });
     // TODONE: Update the correct popup fields
        map.on('load', () => {
            map.addSource('county_pop', {
                type: 'geojson',
                data: 'data/popul_byco2018.geojson'
            });

            map.addLayer({
                id: 'county_pop', type: 'fill', source: 'county_pop',
                paint: { }
            });

            map.addLayer({
                id: 'county_lines', type: 'line', source: 'county_pop',
                paint: { }
            });
        });   
        // TODO: Update the correct popup fields
 map.on('click', 'county_pop', function (e) {
                const properties = e.features[0].properties;

                const countyName = properties.cowntee_NA;
                const population = Number(
                    properties.popul_byco
                ).toLocaleString();

                new maplibregl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(`
                        <h3>${countyName} County</h3>
                        <p>
                            <strong>Population:</strong>
                            ${population}
                        </p>
                    `)
                    .addTo(map);
            });

            // Change cursor when hovering over a county
            map.on('mouseenter', 'county_pop', function () {
                map.getCanvas().style.cursor = 'pointer';
            });

            map.on('mouseleave', 'county_pop', function () {
                map.getCanvas().style.cursor = '';
            });
    </script>
</body>
</html>
